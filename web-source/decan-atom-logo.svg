<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Decan Movie Atom Logo</title>
  <desc id="desc">A futuristic atom symbol representing Decan Movie.</desc>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke="#00e5ff" stroke-width="2.2" filter="url(#glow)">
    <ellipse cx="32" cy="32" rx="25" ry="10"/>
    <ellipse cx="32" cy="32" rx="25" ry="10" transform="rotate(60 32 32)"/>
    <ellipse cx="32" cy="32" rx="25" ry="10" transform="rotate(120 32 32)"/>
  </g>
  <circle cx="32" cy="32" r="6" fill="#00e5ff" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="2" fill="#fff"/>
</svg>
