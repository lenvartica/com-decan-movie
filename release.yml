name: Decan Movie Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.9'

jobs:
  release:
    name: Build Signed Release APK and AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DECAN_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/decan-release.jks"

      - name: Build signed release APK and AAB
        env:
          DECAN_KEYSTORE_FILE: ${{ runner.temp }}/decan-release.jks
          DECAN_KEYSTORE_PASSWORD: ${{ secrets.DECAN_KEYSTORE_PASSWORD }}
          DECAN_KEY_ALIAS: ${{ secrets.DECAN_KEY_ALIAS }}
          DECAN_KEY_PASSWORD: ${{ secrets.DECAN_KEY_PASSWORD }}
        run: |
          test -n "$DECAN_KEYSTORE_PASSWORD"
          test -n "$DECAN_KEY_ALIAS"
          test -n "$DECAN_KEY_PASSWORD"
          gradle --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Rename release files
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/*.apk release/Decan-Movie-${GITHUB_REF_NAME}-release.apk
          cp app/build/outputs/bundle/release/*.aab release/Decan-Movie-${GITHUB_REF_NAME}-release.aab

      - name: Generate SHA-256 checksums
        run: sha256sum release/* > release/SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: decan-movie-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error
          retention-days: 90
